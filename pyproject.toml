[build-system]
requires = [
    "scikit-build-core>=0.10"
]
build-backend = "scikit_build_core.build"

[project]
name = "geo-external-operator"
version = "1.1.0"
description = "External geometric response operator for the GEO framework"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Leonel Hernán Torreblanca" }
]
keywords = [
    "cosmology",
    "geometry",
    "CLASS",
    "scientific-computing"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics"
]

[project.optional-dependencies]
test = [
    "pytest>=8"
]


docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5"
]

[project.urls]
Homepage = "https://github.com/LeoTorreblanca/GEO-External-Operator"
Repository = "https://github.com/LeoTorreblanca/GEO-External-Operator"
Issues = "https://github.com/LeoTorreblanca/GEO-External-Operator/issues"

[tool.scikit-build]
wheel.packages = ["src/geo_external_operator"]
cmake.version = ">=3.15"

sdist.include = [
    "src/*.c",
    "include/*.h",
    "src/geo_external_operator/*.py",
    "tests/*.py",
    "examples/**",
    "adapters/**",
    "provenance/**",
    "CITATION.cff",
    "VERSION"
]

sdist.exclude = [
    ".venv",
    ".venv-*",
    "dist",
    "build",
    "site",
    ".pytest_cache",
    "**/__pycache__",
    "*.egg-info"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
